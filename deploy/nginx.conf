worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # ── Rate limiting (basic DDoS protection) ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── HTTP: ACME challenge (for cert issuance/renewal) + redirect → HTTPS ──
    server {
        listen 80;
        server_name commitlens.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name commitlens.tech;

        # TLS — deploy/tls.sh writes here (self-signed until the real
        # Let's Encrypt cert is issued, then swaps it in place)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 50M;

        # ── Go core API (Core-engine) — includes GitHub webhooks
        #    (/v1/connect-org/github/webhook) and the DM WebSocket (/v1/dm/ws) ──
        location /v1/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass         http://app:8000/v1/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout 10s;
        }

        # ── AI backend health check — cheap, read-only, no auth needed, so
        # unlike the rest of /ai/* below this one is fine to expose as-is.
        # core-ai's health router lives at /health (not under /ai/), hence
        # the separate exact-match location instead of falling under /ai/.
        location = /ai/health {
            proxy_pass         http://ai:9000/health/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Python AI backend — ONLY the /ai/* router (math, react-agent,
        # explain-commit-file-change). /analysis/* is intentionally NOT
        # proxied: it takes a raw numeric workspace/repo id with no auth
        # check at all, so exposing it publicly would let anyone enumerate
        # and read other workspaces' commit data.
        #
        # The /ai/* endpoints below have no auth either (they just aren't as
        # trivially enumerable) — they call Azure OpenAI on every request, so
        # a public, unauthenticated /ai/react-agent is a real cost-abuse
        # vector. Uncomment the auth_basic lines once you've generated
        # deploy/certs/htpasswd (see deploy/tls.sh) if you want this public;
        # otherwise consider dropping this location and only calling `ai`
        # over the internal Docker network from `app`, which is all the Go
        # backend actually needs.
        location /ai/ {
            limit_req zone=api burst=20 nodelay;

            # auth_basic           "Restricted";
            # auth_basic_user_file /etc/nginx/certs/htpasswd;

            proxy_pass         http://ai:9000/ai/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # LLM calls can run long — give them more headroom than /v1.
            proxy_read_timeout 300s;
        }

        # ── Next.js frontend — everything else ────────────────────────────────
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
