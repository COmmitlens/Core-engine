version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commitlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"           # remove this line if you don't need external DB access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (used by asynq background queue)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commitlens_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"           # remove this line to keep Redis internal only
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # CommitLens API (Go backend)
  #
  # Pin COMMITLENS_VERSION in .env to a specific release, e.g. v1.2.3
  # To upgrade: change the version, then run:
  #   docker compose pull && docker compose up -d
  # ─────────────────────────────────────────────
  app:
    image: ghcr.io/commitlens/commitlens-core:${COMMITLENS_VERSION:-latest}
    container_name: commitlens_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Nginx reverse proxy (TLS termination)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: commitlens_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # mount your TLS cert + key here
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
