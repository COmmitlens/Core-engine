services:
  # ─────────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commitlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (used by asynq background queue)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commitlens_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Go backend (Core-engine)
  # ─────────────────────────────────────────────
  app:
    image: ghcr.io/commitlens/commitlens-core:${CORE_VERSION:-dev}
    container_name: commitlens_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Python FastAPI AI backend (core-ai)
  # ─────────────────────────────────────────────
  ai:
    image: ghcr.io/commitlens/commitlens-ai:${AI_VERSION:-dev}
    container_name: commitlens_ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  # ─────────────────────────────────────────────
  # Next.js frontend (twin-ai-fe)
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/commitlens/commitlens-frontend:${FRONTEND_VERSION:-dev}
    container_name: commitlens_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_AI_URL: "http://localhost:8001"
    depends_on:
      - app
      - ai
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
