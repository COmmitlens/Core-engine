services:
  # ─────────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commitlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (used by asynq background queue)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commitlens_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Go backend (Core-engine) — internal only, reached via nginx at /v1/
  # ─────────────────────────────────────────────
  app:
    image: ghcr.io/commitlens/commitlens-core:${CORE_VERSION:-dev}
    container_name: commitlens_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      # core-ai's uvicorn process binds :9000 (see core-ai/entrypoint.sh) — not
      # :8001. Keep this in sync if that ever changes.
      AI_BACKEND_URL: "http://ai:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # Routes are registered under /v1 (route/v1.go) — plain /health 404s.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Python FastAPI AI backend (core-ai) — internal only.
  # Deliberately NOT proxied publicly except the narrow /ai/* surface (see
  # deploy/nginx.conf) — none of these endpoints have auth, so anything wider
  # would let anyone unauthenticated read workspace data or trigger paid LLM calls.
  # ─────────────────────────────────────────────
  ai:
    image: ghcr.io/commitlens/commitlens-ai:${AI_VERSION:-dev}
    container_name: commitlens_ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
      # core-ai's Settings (app/config.py) requires these exact names — map
      # them from the single Go-style pair already in .env so there's one
      # source of truth for the Azure credentials.
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_KEY}"
      ENDPOINT_URL: "${AZURE_OPENAI_ENDPOINT}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9000"
    # Dockerfile already declares HEALTHCHECK against :9000/health — inherited.

  # ─────────────────────────────────────────────
  # Next.js frontend (twin-ai-fe) — internal only, served at / by nginx
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/commitlens/commitlens-frontend:${FRONTEND_VERSION:-dev}
    container_name: commitlens_frontend
    restart: unless-stopped
    environment:
      # Public URL — this is what the browser calls, not an internal service
      # name. Baked build-time placeholder gets swapped for this value at
      # container start (see docker-entrypoint.sh in the frontend repo).
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://commitlens.tech/v1}"
    depends_on:
      - app
      - ai
    expose:
      - "3000"

  # ─────────────────────────────────────────────
  # Nginx — single public entry point (TLS termination + path routing)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: commitlens_nginx
    restart: unless-stopped
    depends_on:
      - app
      - ai
      - frontend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
