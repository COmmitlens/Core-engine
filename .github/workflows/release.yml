name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: commitlens/commitlens-core   # → ghcr.io/commitlens/commitlens-core

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint & build — must pass before we spend time on a real image build
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        run: go build ./...

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build & push the container image
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      # Required by Trivy / GitHub security tab
      security-events: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no manual secret needed

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Full semver  e.g. 1.2.3
            type=semver,pattern={{version}}
            # Major.minor  e.g. 1.2
            type=semver,pattern={{major}}.{{minor}}
            # Short SHA for traceability
            type=sha,prefix=sha-,format=short
            # :dev on every push to dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # :latest only on a release tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=CommitLens Core
            org.opencontainers.image.description=CommitLens Go core engine — GitHub ingestion, embeddings orchestration, Slack + WebSocket messaging
            org.opencontainers.image.vendor=CommitLens

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Expose build-time metadata (digest, etc.)
          provenance: true
          sbom: true

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Vulnerability scan — runs after image is published
  # ──────────────────────────────────────────────────────────────────────────
  scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy on published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan by digest so this always checks exactly what was just pushed,
          # regardless of which tag(s) — :dev vs :latest — this run produced.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"   # don't fail the workflow; just upload findings

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Summary — print digest + tags as a job summary
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [build-and-push, scan]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Docker release summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ needs.build-and-push.outputs.image-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ needs.build-and-push.outputs.image-tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
