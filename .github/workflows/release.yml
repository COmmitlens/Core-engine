name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"        # triggers on v1.0.0, v1.2.3, etc.
    branches:
      - dev             # triggers on every push to dev → builds :dev image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/commitlens-core   # → ghcr.io/commitlens/commitlens-core

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no manual secret needed

      # Generates tags:
      #   ghcr.io/commitlens/commitlens-core:v1.2.3
      #   ghcr.io/commitlens/commitlens-core:1.2
      #   ghcr.io/commitlens/commitlens-core:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64    # covers most on-premise servers
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
